name: Arch Build

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Arch Linux, GCC
    runs-on: ubuntu-latest
    timeout-minutes: 180

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install build toolchain
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake curl git ninja python spirv-tools \
            vulkan-headers vulkan-icd-loader

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Slang
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/shader-slang/slang/releases/latest)"
          mapfile -t asset < <(python -c '
          import json, sys
          release = json.load(sys.stdin)
          asset = next(asset for asset in release["assets"] if asset["name"].endswith("-linux-x86_64.tar.gz"))
          print(asset["browser_download_url"])
          print(asset["digest"].removeprefix("sha256:"))
          ' <<< "${release}")

          archive="${RUNNER_TEMP}/slang.tar.gz"
          curl --fail --silent --show-error --location --retry 5 --output "${archive}" "${asset[0]}"
          printf '%s  %s\n' "${asset[1]}" "${archive}" | sha256sum --check --status
          mkdir --parents /opt/slang
          tar --extract --gzip --file "${archive}" --directory /opt/slang
          echo "/opt/slang/bin" >> "${GITHUB_PATH}"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DSPECTRA_BUILD_UI=OFF

      - name: Build
        run: cmake --build build --parallel 30
