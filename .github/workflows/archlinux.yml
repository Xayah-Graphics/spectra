name: Arch Linux

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: archlinux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Arch Linux, GCC, CMake+Ninja)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake cuda curl git ninja python \
            vulkan-headers vulkan-icd-loader \
            wayland wayland-protocols libxkbcommon \
            libx11 libxrandr libxinerama libxcursor libxi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Slang
        run: |
          slang_url="$(curl -fsSL https://api.github.com/repos/shader-slang/slang/releases/latest | python -c 'import json, sys; print(next(asset["browser_download_url"] for asset in json.load(sys.stdin)["assets"] if asset["name"].endswith("-linux-x86_64.tar.gz")))')"
          mkdir -p /opt/slang
          curl -fsSL --retry 5 --retry-delay 2 "${slang_url}" | tar -xz -C /opt/slang

      - name: Install OptiX SDK
        run: |
          optix_tag="$(curl -fsSL https://api.github.com/repos/NVIDIA/optix-sdk/releases/latest | python -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])')"
          git clone --depth 1 --branch "${optix_tag}" https://github.com/NVIDIA/optix-sdk.git /opt/optix-sdk

      - name: Configure
        run: |
          . /etc/profile
          export PATH="/opt/slang/bin:${PATH}"
          mv "$("${NVCC_CCBIN}" -print-file-name=libstdc++.modules.json)" /usr/lib/libstdc++.modules.json
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="${NVCC_CCBIN}" \
            -DCMAKE_CUDA_HOST_COMPILER="${NVCC_CCBIN}" \
            -DSPECTRA_OPTIX_PATH=/opt/optix-sdk

      - name: Build
        run: cmake --build build --parallel 30
