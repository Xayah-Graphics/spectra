name: Windows

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Windows, MSVC, CMake+Ninja)
    runs-on: windows-2025-vs2026
    timeout-minutes: 180

    env:
      CMAKE_BUILD_TYPE: Release
      SPECTRA_BUILD_DIR: build
      SPECTRA_CMAKE_VERSION: '4.4.0'
      SPECTRA_NINJA_VERSION: '1.13.0'
      SPECTRA_CUDA_VERSION: '13.3.0'
      SPECTRA_VULKAN_VERSION: '1.4.350.0'
      SPECTRA_OPTIX_TAG: v9.1.0
      SPECTRA_SLANG_URL: https://github.com/shader-slang/slang/releases/download/v2026.11/slang-2026.11-windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install CMake and Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install "cmake==$env:SPECTRA_CMAKE_VERSION" "ninja==$env:SPECTRA_NINJA_VERSION"

      - name: Install CUDA Toolkit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cudaVersion = [System.Version]$env:SPECTRA_CUDA_VERSION
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$($cudaVersion.Major).$($cudaVersion.Minor)"
          $installer = Join-Path $env:RUNNER_TEMP "cuda-$env:SPECTRA_CUDA_VERSION-installer.exe"
          $installerUrl = "https://developer.download.nvidia.com/compute/cuda/$env:SPECTRA_CUDA_VERSION/network_installers/cuda_$($env:SPECTRA_CUDA_VERSION)_windows_network.exe"

          Invoke-WebRequest -Uri $installerUrl -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList "-s" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "CUDA $env:SPECTRA_CUDA_VERSION installer exited with code $($process.ExitCode)."
          }

          "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CUDAToolkit_ROOT=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $cudaPath "bin") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.SPECTRA_VULKAN_VERSION }}
          cache: true

      - name: Install Slang
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $slangArchive = Join-Path $env:RUNNER_TEMP "slang.zip"
          $slangRoot = Join-Path $env:RUNNER_TEMP "slang"

          Invoke-WebRequest -Uri $env:SPECTRA_SLANG_URL -OutFile $slangArchive
          Expand-Archive -LiteralPath $slangArchive -DestinationPath $slangRoot -Force

          $slangc = Get-ChildItem -LiteralPath $slangRoot -Recurse -Filter slangc.exe | Select-Object -First 1
          if ($null -eq $slangc) {
            throw "slangc.exe was not found after extracting $env:SPECTRA_SLANG_URL."
          }

          (Split-Path -Parent $slangc.FullName) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "SLANG_DIR=$slangRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install OptiX SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $optixRoot = Join-Path $env:RUNNER_TEMP "optix-sdk"

          git clone --depth 1 --branch $env:SPECTRA_OPTIX_TAG https://github.com/NVIDIA/optix-sdk.git $optixRoot
          if (-not (Test-Path -LiteralPath (Join-Path $optixRoot "include\optix.h"))) {
            throw "OptiX headers were not found after cloning $env:SPECTRA_OPTIX_TAG."
          }

          "SPECTRA_OPTIX_PATH=$optixRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Enter Visual Studio developer environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $developerCommand = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          cmd /d /s /c "`"$developerCommand`" -arch=x64 -host_arch=x64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: Toolchain sanity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cl.exe
          cmake --version
          ninja --version
          nvcc --version
          slangc -version

          $cmakeVersionLine = (cmake --version | Select-Object -First 1)
          if ($cmakeVersionLine -notmatch "version ([0-9]+)\.([0-9]+)") {
            throw "Unable to parse CMake version from: $cmakeVersionLine"
          }
          $cmakeMajor = [int]$Matches[1]
          $cmakeMinor = [int]$Matches[2]
          if ($cmakeMajor -lt 4 -or ($cmakeMajor -eq 4 -and $cmakeMinor -lt 4)) {
            throw "CMake 4.4 or newer is required; found $cmakeVersionLine."
          }

          $nvccVersion = (nvcc --version) -join "`n"
          if ($nvccVersion -notmatch "release 13\.3") {
            throw "CUDA 13.3 is required; nvcc reported: $nvccVersion"
          }

          if (-not (Test-Path -LiteralPath (Join-Path $env:VULKAN_SDK "Include\vulkan\vulkan.h"))) {
            throw "Vulkan headers were not found under $env:VULKAN_SDK."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:SPECTRA_OPTIX_PATH "include\optix.h"))) {
            throw "OptiX headers were not found under $env:SPECTRA_OPTIX_PATH."
          }

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B "$env:SPECTRA_BUILD_DIR" -G Ninja `
            "-DCMAKE_BUILD_TYPE=$($env:CMAKE_BUILD_TYPE)" `
            "-DSPECTRA_OPTIX_PATH=$($env:SPECTRA_OPTIX_PATH)"

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build $env:SPECTRA_BUILD_DIR --parallel 30
