name: Windows

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Windows, MSVC, CMake+Ninja)
    runs-on: windows-2025-vs2026
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install CMake and Ninja
        run: python -m pip install --upgrade cmake ninja

      - name: Install CUDA Toolkit
        run: |
          $repository = (Invoke-WebRequest -Uri "https://developer.download.nvidia.com/compute/cuda/repos/windows/x86_64/").Content
          $cudaVersion = [regex]::Matches($repository, 'version_(\d+\.\d+\.\d+)\.json') | ForEach-Object { [System.Version]$_.Groups[1].Value } | Sort-Object -Descending | Select-Object -First 1
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$($cudaVersion.Major).$($cudaVersion.Minor)"
          $installer = Join-Path $env:RUNNER_TEMP "cuda-$cudaVersion-installer.exe"
          $installerUrl = "https://developer.download.nvidia.com/compute/cuda/$cudaVersion/network_installers/cuda_$($cudaVersion)_windows_network.exe"

          Invoke-WebRequest -Uri $installerUrl -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList "-s" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

          "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $cudaPath "bin") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true

      - name: Install Slang
        run: |
          $slangArchive = Join-Path $env:RUNNER_TEMP "slang.zip"
          $slangRoot = Join-Path $env:RUNNER_TEMP "slang"
          $slangRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/shader-slang/slang/releases/latest"
          $slangUrl = ($slangRelease.assets | Where-Object name -Like "slang-*-windows-x86_64.zip").browser_download_url

          Invoke-WebRequest -Uri $slangUrl -OutFile $slangArchive
          Expand-Archive -LiteralPath $slangArchive -DestinationPath $slangRoot

          $slangc = Get-ChildItem -LiteralPath $slangRoot -Recurse -Filter slangc.exe | Select-Object -First 1
          (Split-Path -Parent $slangc.FullName) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install OptiX SDK
        run: |
          $optixRoot = Join-Path $env:RUNNER_TEMP "optix-sdk"
          $optixTag = (Invoke-RestMethod -Uri "https://api.github.com/repos/NVIDIA/optix-sdk/releases/latest").tag_name

          git clone --depth 1 --branch $optixTag https://github.com/NVIDIA/optix-sdk.git $optixRoot
          "SPECTRA_OPTIX_PATH=$optixRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Enter Visual Studio developer environment
        run: |
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $developerCommand = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          cmd /d /s /c "`"$developerCommand`" -arch=x64 -host_arch=x64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DSPECTRA_OPTIX_PATH=$($env:SPECTRA_OPTIX_PATH)"

      - name: Build
        run: cmake --build build --parallel 30
